<div class="row mt-3">
    <div class="col-md-6 offset-md-3 col-xs-12">
        <div class="card">
            <div class="card-header">
                {{ isLogin?"Login":"Sign UP"}}
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="" class="form-label">Email</label>
                    <input type="text" name="" id="" class="form-control" [(ngModel)]="email">
                </div>
                <div class="mb-3">
                    <label for="" class="form-label">Password</label>
                    <input type="password" name="" id="" class="form-control" [(ngModel)]="password">
                </div>
                <div class="mb-3">
                    <button class="btn btn-success" (click)="onLogin()">
                        {{ isLogin?"Login":"Sign UP"}}
                    </button>

                    <button class="btn btn-info float-end " (click)="isLogin=!isLogin" >
                        {{ isLogin?"Create new account":"Login to application"}} 


                    </button>

                </div>
            </div>
        </div>
    </div>
</div>
