<div class="card mt-3">
    <div class="card-header">
        Inventorization items
    </div>
    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Name</th>
                    <th>Location</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of items(); let i=index">
                    <td>{{ item.inv_no }}</td>
                    <td>{{ item.name }}</td>
                    <td>
                        <span *ngFor="let location of item.locations ">{{ location }}</span> 
                    </td>
                    <td></td>
                </tr>
            </tbody>

        </table>
    </div>
</div>
